<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — CareerPath AI</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="/index.html" class="nav-logo">
        <div class="nav-logo-icon">🧭</div>
        <span>CareerPath <em>AI</em></span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/explore.html">Explore Careers</a></li>
        <li><a href="/resources.html">Resources</a></li>
        <li><a href="/about.html">About</a></li>
      </ul>
      <div class="nav-actions" id="navActions">
        <a href="/login.html" class="btn btn-outline btn-sm" id="navLoginBtn">Login</a>
        <a href="/signup.html" class="btn btn-primary btn-sm" id="navSignupBtn">Sign Up</a>
        <div class="nav-user" id="navUserArea" style="display:none;">
          <i class="fas fa-user-circle"></i>
          <span>Welcome, <strong id="navUserName">User</strong></span>
        </div>
        <button class="btn btn-outline btn-sm" id="navLogoutBtn" style="display:none;" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Signup Form -->
  <div class="form-page">
    <div class="auth-card">

      <div class="auth-card-header">
        <div class="auth-icon">
          <i class="fas fa-user-plus"></i>
        </div>
        <h2>Create Account</h2>
        <p>Join CareerPath AI and build your future</p>
      </div>

      <!-- Alert Banner -->
      <div class="alert" id="signupAlert"></div>

      <!-- Signup Form -->
      <form id="signupForm" novalidate>

        <!-- Full Name -->
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>
            <input
              type="text"
              id="signupName"
              name="name"
              placeholder="Your full name"
              autocomplete="name"
              required
            />
          </div>
          <div class="form-error" id="signupNameError"></div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="signupEmail">Email Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input
              type="email"
              id="signupEmail"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-error" id="signupEmailError"></div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input
              type="password"
              id="signupPassword"
              name="password"
              placeholder="Minimum 6 characters"
              autocomplete="new-password"
              required
            />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="form-error" id="signupPasswordError"></div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="signupConfirm">Confirm Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input
              type="password"
              id="signupConfirm"
              name="confirmPassword"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              required
            />
            <button type="button" class="toggle-password" id="toggleConfirm" aria-label="Toggle password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="form-error" id="signupConfirmError"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="signupSubmitBtn">
          <i class="fas fa-user-plus"></i> Create Account
        </button>

      </form>

      <div class="form-footer">
        Already have an account?
        <a href="/login.html">Login here</a>
      </div>

    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
